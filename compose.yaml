services:
  road-runner:
    build: .
    restart: unless-stopped
    environment:
      TZ: ${ROAD_RUNNER_TZ:-Europe/Berlin}
    ports:
      - "${ROAD_RUNNER_PORT:-8080}:8080"
    volumes:
      - reisedaten:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  reisedaten:
