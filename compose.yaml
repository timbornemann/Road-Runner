services:
  road-runner:
    image: ${ROAD_RUNNER_IMAGE:-ghcr.io/timbornemann/road-runner:latest}
    restart: unless-stopped
    environment:
      TZ: ${ROAD_RUNNER_TZ:-Europe/Berlin}
      RR_MCP_ENABLED: ${RR_MCP_ENABLED:-false}
      RR_MCP_READ_ONLY: ${RR_MCP_READ_ONLY:-false}
      RR_MCP_TOKEN: ${RR_MCP_TOKEN:-}
      RR_PHOTON_URL: ${RR_PHOTON_URL:-https://photon.komoot.io}
      RR_OVERPASS_URL: ${RR_OVERPASS_URL:-https://overpass.private.coffee/api/interpreter}
      RR_OSRM_URL: ${RR_OSRM_URL:-https://routing.openstreetmap.de/routed-car}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${ROAD_RUNNER_PORT:-8080}:8080"
    volumes:
      - reisedaten:/data

volumes:
  reisedaten:
