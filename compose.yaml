services:
  road-runner:
    image: ghcr.io/timbornemann/road-runner:latest
    restart: unless-stopped
    environment:
      TZ: ${ROAD_RUNNER_TZ:-Europe/Berlin}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${ROAD_RUNNER_PORT:-8080}:8080"
    volumes:
      - reisedaten:/data

volumes:
  reisedaten:
